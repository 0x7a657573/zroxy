# Safe local example. Change PORT to a LAN address only when clients need it.
PORT = 127.0.0.1:8443@443
SNITIMEOUT = 30
# Relay idle limit in seconds (default 300).
# SNIIDLETIMEOUT = 300
LOG = 2

# Names from clients may not resolve to loopback unless this is "yes".
# ALLOWLOOPBACK = no
# Also refuse private destinations (10/8, 172.16/12, 192.168/16, 100.64/10, fc00::/7).
# DENYPRIVATE = no

# Optional SOCKS5 upstream, including credentials if required:
# SOCKS = username:password@127.0.0.1:1080
# Or keep the password out of this file (chmod 600 the password file):
# SOCKS = username@127.0.0.1:1080
# SOCKSPASSFILE = /etc/zroxy/socks.pass
# A monitor token can come from a file the same way (MONITORTOKENFILE).

# SNI listeners need a hostname whitelist: zroxy refuses to start without
# one, because it would forward every name to anywhere (an open proxy).
# Create the file and uncomment WHITE before enabling the service, or set
# OPENPROXY = yes to accept the risk. OPENPROXY has no effect when WHITE is set.
# WHITE = /etc/zroxy/whitelist.txt
# OPENPROXY = no

# Optional local DNS service. Avoid 53 (dnsmasq) and 5353 (mDNS).
# LDNS = 127.0.0.1:5354
# DNS = 1.1.1.1:53
# DACL = 127.0.0.0/8
# Upstream DNS-over-TCP connections, 1..96 (default 96). Keep it low on a router.
# DNSCONNECTIONS = 8
